name: Apply family and children migration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Validate database secret
        run: |
          test -n "$SUPABASE_DB_URL" || (echo "SUPABASE_DB_URL is missing" && exit 1)

      - name: Apply family and children migration
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/202609280002_family_children_member_portal.sql
